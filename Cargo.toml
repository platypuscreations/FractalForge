[workspace]
resolver = "3"
members = ["crates/core", "crates/render", "crates/formats", "apps/cli", "apps/gui"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/platypuscreations/FractalForge"
publish = false

[workspace.dependencies]
fractalforge-core = { path = "crates/core" }
fractalforge-render = { path = "crates/render" }
fractalforge-formats = { path = "crates/formats" }
rayon = "1.10"
weezl = "0.1.8"
miniz_oxide = "0.8"
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
eframe = { version = "0.37", default-features = false, features = ["wgpu", "accesskit", "wayland", "x11"] }
rfd = "0.17"
png = "0.18"
proptest = { version = "1.5", default-features = false, features = ["std"] }

[workspace.lints.rust]
# Denied everywhere; the only exception is apps/gui/src/macos.rs, which has
# to talk to AppKit to receive files opened from Finder.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
