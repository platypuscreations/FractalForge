# SPDX-License-Identifier: GPL-3.0-or-later

[workspace]
resolver = "3"
members = ["crates/core", "crates/render", "crates/formats", "apps/cli", "apps/gui"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/platypuscreations/FractalForge"
publish = false

[workspace.dependencies]
fractalforge-core = { path = "crates/core" }
fractalforge-render = { path = "crates/render" }
fractalforge-formats = { path = "crates/formats" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
