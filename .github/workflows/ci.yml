name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, os: macos-latest }
          - { name: macos-x86_64, os: macos-15-intel }
          - { name: linux-x86_64, os: ubuntu-latest }
          - { name: windows-x86_64, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev
      - run: cargo clippy --workspace --all-targets --locked
      # Optimised: the formula and colouring corpus tests render over a
      # thousand reference images, which takes ~30 min in a debug build.
      - run: cargo test --workspace --locked --release

  package-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo install --locked cargo-packager
      - run: scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FractalForge-macos-universal
          path: target/packager/*.dmg

  package-linux:
    # The oldest supported Ubuntu, so the .deb runs on 22.04 and later.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - run: cargo install --locked cargo-packager
      - run: scripts/package-linux.sh
      - name: Install the .deb and check it
        run: |
          sudo apt-get install -y ./target/packager/*.deb
          dpkg -L fractalforge | grep -E 'bin/fractalforge$|\.desktop$|icons/'
          grep -E '^(Exec|Icon|MimeType)=' /usr/share/applications/fractalforge.desktop
      - uses: actions/upload-artifact@v4
        with:
          name: FractalForge-linux
          path: |
            target/packager/*.deb
            target/packager/*.tar.gz

  package-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install --locked cargo-packager
      - run: scripts/package-windows.sh
      - name: Install the .msi and check it
        shell: pwsh
        run: |
          $msi = Get-ChildItem target/packager/*.msi | Select-Object -First 1
          $p = Start-Process msiexec -ArgumentList "/i `"$($msi.FullName)`" /qn /l*v install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 50; exit $p.ExitCode }
          Get-ChildItem -Recurse "$env:ProgramFiles\FractalForge" | Select-Object FullName
      - uses: actions/upload-artifact@v4
        with:
          name: FractalForge-windows
          path: |
            target/packager/*.msi
            target/packager/*.zip

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
      - run: scripts/check-spdx.sh

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources
