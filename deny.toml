# SPDX-License-Identifier: GPL-3.0-or-later
#
# Every dependency must be compatible with GPL-3.0-or-later.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
# The allowlist is policy, not an inventory: don't warn about unused entries.
unused-allowed-license = "allow"
# GPL-3.0-compatible licenses only. Note: GPL-2.0-only and Apache-1.x are NOT
# compatible and must never be added here.
allow = [
    "GPL-3.0-or-later",
    "GPL-3.0-only",
    "LGPL-2.1-or-later",
    "LGPL-3.0-or-later",
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "MPL-2.0",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
]

[licenses.private]
# Our own unpublished workspace crates.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
