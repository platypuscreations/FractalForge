# SPDX-License-Identifier: GPL-3.0-or-later
#
# Every dependency must be compatible with GPL-3.0-or-later.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Transitive dependencies of eframe that we can't upgrade ourselves. Review
# whenever eframe is updated, and remove entries as soon as they clear.
ignore = [
    # quick-xml 0.38 (DoS on hostile XML), pinned by zbus_xml in the Linux
    # accessibility bridge (accesskit -> AT-SPI over D-Bus). It only parses
    # introspection XML from local system services.
    { id = "RUSTSEC-2026-0194", reason = "transitive via accesskit/zbus; local D-Bus XML only" },
    { id = "RUSTSEC-2026-0195", reason = "transitive via accesskit/zbus; local D-Bus XML only" },
    # Unmaintained, no maintained replacement available upstream yet.
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser via egui font rendering; parses local system fonts" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant via accesskit/zbus (Linux accessibility)" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names via accesskit/zbus (Linux accessibility)" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive via accesskit/zbus (Linux accessibility)" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# The allowlist is policy, not an inventory: don't warn about unused entries.
unused-allowed-license = "allow"
# GPL-3.0-compatible licenses only. Note: GPL-2.0-only and Apache-1.x are NOT
# compatible and must never be added here.
allow = [
    "GPL-3.0-or-later",
    "GPL-3.0-only",
    "LGPL-2.1-or-later",
    "LGPL-3.0-or-later",
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "MPL-2.0",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
]

[licenses.private]
# Our own unpublished workspace crates.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
