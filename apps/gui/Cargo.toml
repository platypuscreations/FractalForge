[package]
name = "fractalforge"
description = "FractalForge desktop fractal explorer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.packager]
product-name = "FractalForge"
identifier = "io.github.platypuscreations.fractalforge"
category = "GraphicsAndDesign"
copyright = "GPL-3.0-or-later"
# Each platform picks its format: .icns (macOS), .ico (Windows), .png (Linux).
icons = ["assets/icon.icns", "assets/icon.ico", "assets/icon-256.png"]
out-dir = "../../target/packager"
binaries = [{ path = "fractalforge", main = true }]
file-associations = [
    { extensions = ["gif"], mime-type = "image/gif", name = "GIF image", role = "viewer", description = "GIF image (FractalForge or Fractint)" },
    { extensions = ["par"], name = "Fractint parameter file", role = "editor", description = "Fractint-format parameter file" },
    { extensions = ["map"], name = "Fractint palette", role = "editor", description = "Fractint-format palette" },
]

[package.metadata.packager.macos]
minimum-system-version = "11.0"

# Ubuntu 22.04 and later. The window system, graphics and file-dialog
# libraries are loaded at run time, so they're listed here rather than
# linked; the fonts are the ones fonts.rs looks for.
[package.metadata.packager.deb]
depends = [
    "libxkbcommon0",
    "libvulkan1 | libegl1",
    "xdg-desktop-portal",
    "fonts-dejavu-core | fonts-liberation",
]
section = "graphics"
priority = "optional"

[dependencies]
fractalforge-core.workspace = true
fractalforge-render.workspace = true
fractalforge-formats.workspace = true
fractalforge-formula.workspace = true
eframe.workspace = true
# Defaults off: the title-text decoration feature pulls in an unmaintained
# font parser. Wayland windows get frames without title text instead.
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita-notitle"] }
rfd.workspace = true
rayon.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString", "NSURL"] }

[lints]
workspace = true
