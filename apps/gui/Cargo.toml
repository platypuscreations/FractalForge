# SPDX-License-Identifier: GPL-3.0-or-later

[package]
name = "fractalforge"
description = "FractalForge desktop fractal explorer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.packager]
product-name = "FractalForge"
identifier = "io.github.platypuscreations.fractalforge"
category = "GraphicsAndDesign"
copyright = "GPL-3.0-or-later"
icons = ["assets/icon.icns"]
formats = ["app", "dmg"]
out-dir = "../../target/packager"
binaries = [{ path = "fractalforge", main = true }]
file-associations = [
    { extensions = ["gif"], name = "GIF image", role = "viewer", description = "GIF image (FractalForge or Fractint)" },
    { extensions = ["par"], name = "Fractint parameter file", role = "editor", description = "Fractint-format parameter file" },
    { extensions = ["map"], name = "Fractint palette", role = "editor", description = "Fractint-format palette" },
]

[package.metadata.packager.macos]
minimum-system-version = "11.0"

[dependencies]
fractalforge-core.workspace = true
fractalforge-render.workspace = true
fractalforge-formats.workspace = true
eframe.workspace = true
winit = "0.30"
rfd.workspace = true
rayon.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString", "NSURL"] }

[lints]
workspace = true
